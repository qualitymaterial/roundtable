name: Verify source
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: node dist/cli.js demo
        env:
          ROUNDTABLE_HOME: ${{ runner.temp }}/roundtable-demo
      - name: Windows standalone installation
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test-windows-install.ps1
